[project]
name = "library-claim-agent"
version = "0.1.0"
description = "Evidence-backed home library contents claim capture"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "google-genai>=1.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "tenacity>=8.3",
  "opencv-contrib-python-headless>=4.10",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "shapely>=2.0",
  "rapidfuzz>=3.9",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "orjson>=3.10",
  "typer>=0.12",
  "rich>=13.7",
  "pillow>=10.3",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gpu = ["modal>=0.64"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
