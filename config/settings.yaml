capture:
  # Tuned on a Galaxy S24 FE during the 2026-11-26 field test.
  blur_min: 200
  low_light_exposure_max: 85
  glare_max_frac: 0.06
  dark_mean: 50
  bright_mean: 210
  speed_max_dps: 35
  speed_sustain_s: 1
  face_score_threshold: 0.85
  haar_min_neighbors: 8
  haar_min_size_fraction: 0.10
  haar_scale_factor: 1.1
  text_px_min: 18
  frame_min_interval_ms: 300
  frame_gyro_max_dps: 120
  motion_sample_hz: 10
  jpeg_quality: 0.85
  max_inflight_frames: 3
  max_buffered_frames: 20
  reconnect_initial_ms: 250
  reconnect_max_ms: 8000
cues:
  window_s: 2
  blurred_fraction: 0.40
  min_gap_s: 12
  same_type_gap_s: 30
  low_light_blurry_sustain_s: 3
keyframes:
  min_novelty: 0.15
  detection_interval_s: 1.5
  detection_max_frames: 60
  recon_min: 40
  recon_max: 80
dedup:
  eps_factor_thickness: 0.5
  within_frame_iou: 0.80
  within_frame_containment: 0.85
  within_frame_center_factor: 0.30
  within_frame_review_iou_min: 0.50
  item_frame_proximity_fraction: 0.03
identify:
  tau_accept: 0.80
  tau_review: 0.55
  weights:
    title: 0.55
    author: 0.25
    publisher: 0.10
    legibility: 0.10
measure:
  height_range_cm: [8, 45]
  thickness_range_cm: [0.3, 12]
  methods_disagree_pct: 10
room:
  voxel_m: 0.02
  manhattan_snap_deg: 8
  min_conf_for_no_review: 0.5
review:
  row_count_disagreement_pct: 0.10
structure:
  full_row_width_pct: 0.80
vision:
  # Bake-off on Galaxy S24 FE sweep sw_20261126_225839_2007 favored full-frame detection.
  detection_method: full_frame
  detection_model: gemini-3.5-flash-lite
agent:
  timeout_s: 20
  debounce_ms: 800
  history_turns: 8
  max_tool_rounds: 5
  model_chain: [gemini-3.1-flash-lite, gemini-3.5-flash-lite]
  retry_backoff_s: [0.5, 1.5]
  filler_after_s: 2.5
  interim_force_final_s: 1.2
  live_frame_max_side: 768
  live_frame_quality: 0.60
  frame_attachment_keywords: [this, that, here, painting, shelf, book, "what is"]
  frame_attachment_every_n_turns: 3
  echo_window_s: 6
  echo_match_ratio: 85
  earphones_mode: true
  cue_max_words: 8
  cue_suppress_after_user_s: 8
llm:
  default_rate_limit:
    requests_per_minute: 5
    window_s: 60
    max_retries: 3
    backoff_initial_s: 0.5
    backoff_max_s: 8
  model_rate_limits:
    gemini-3.1-flash-lite:
      requests_per_minute: 15
    gemini-3.8-flash:
      requests_per_minute: 5
