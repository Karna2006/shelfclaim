<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>ShelfClaim capture</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="sweep-screen">
      <header class="topbar">
        <strong>ShelfClaim</strong>
        <span id="connection" class="connection" aria-live="polite">Ready</span>
        <span id="agent-connection" class="connection" aria-live="polite">Agent idle</span>
        <span id="mic-status" class="mic-status" data-state="idle" aria-live="polite">Mic: idle</span>
        <time id="timer">00:00</time>
      </header>

      <section class="camera-panel" aria-label="Camera preview">
        <video id="preview" autoplay muted playsinline></video>
        <canvas id="capture-canvas" hidden></canvas>
        <div class="camera-overlay">
          <span id="qc-pill" class="qc-pill" aria-live="polite">Waiting for camera</span>
          <div class="speed-card">
            <div class="speed-label"><span>Camera speed</span><span id="speed-value">—</span></div>
            <div class="speed-track" role="progressbar" aria-label="Camera speed" aria-valuemin="0" aria-valuemax="60" aria-valuenow="0">
              <span id="speed-fill"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="capture-status" aria-live="polite">
        <p id="cards-seen">Cards seen: none</p>
        <p id="message">Start a sweep when you are ready.</p>
      </section>

      <form id="typed-fallback" class="typed-fallback" hidden>
        <label for="typed-message">Type a message</label>
        <div><input id="typed-message" autocomplete="off" /><button type="submit">Send</button></div>
      </form>
      <aside id="mic-blocked" class="notice mic-blocked" role="alert" hidden>
        <span>Microphone blocked — tap the lock icon → Permissions → Microphone → Allow, then tap Retry</span>
        <button id="retry-mic" type="button">Retry mic</button>
      </aside>
      <p id="voice-guidance" class="notice" hidden>Use Chrome for voice. You can type messages below.</p>
      <button id="interrupt-button" class="interrupt-button" type="button" hidden>Tap to interrupt</button>

      <details class="debug-panel">
        <summary>debug</summary>
        <ol id="debug-events" aria-live="polite"></ol>
      </details>

      <footer class="controls">
        <button id="start-button" type="button">Start sweep</button>
        <button id="stop-button" type="button" disabled>Finish sweep</button>
      </footer>
    </main>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
