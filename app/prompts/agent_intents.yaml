  original:
    phrases: [original]
    confirmation: "Okay, I recorded that as an original."
  first_edition:
    phrases: [first edition]
    confirmation: "Okay, I flagged that edition for review."
  signed:
    phrases: [signed, autograph]
    confirmation: "Okay, I flagged the signed item for review."
